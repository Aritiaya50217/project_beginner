name: Contract Proxy CI/CD (Local Docker)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix ./contract-proxy

      - name: Run tests
        run: npm test --prefix ./contract-proxy

      - name: Build Docker image
        run: docker build -t contract-proxy:latest ./contract-proxy

      - name: Run container
        run: |
          docker stop contract-proxy || true
          docker rm contract-proxy || true
          docker run -d --name contract-proxy -p 8083:8083 contract-proxy:latest
