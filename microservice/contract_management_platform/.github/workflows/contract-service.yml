name: Contract Service CI/CD
on:
  push:
    paths:
      - 'contract-service/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      - name: Build Go
        run: |
          cd contract-service
          go mod tidy
          go build -o app ./cmd/server
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/contract-service:${{ github.sha }} contract-service
          docker push ${{ secrets.DOCKER_USERNAME }}/contract-service:${{ github.sha }}
      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
      - name: Deploy
        run: |
          kubectl -n contract-platform set image deployment/contract-service contract-service=${{ secrets.DOCKER_USERNAME }}/contract-service:${{ github.sha }}
