name: Contract Service CI/CD (Local Docker)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix ./contract-service

      - name: Run tests
        run: npm test --prefix ./contract-service

      - name: Build Docker image
        run: docker build -t contract-service:latest ./contract-service

      - name: Run container
        run: |
          docker stop contract-service || true
          docker rm contract-service || true
          docker run -d --name contract-service -p 8082:8082 contract-service:latest
