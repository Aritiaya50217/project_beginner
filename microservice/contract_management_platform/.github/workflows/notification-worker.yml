name: Notification Worker CI/CD (Local Docker)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix ./notification-worker

      - name: Run tests
        run: npm test --prefix ./notification-worker

      - name: Build Docker image
        run: docker build -t notification-worker:latest ./notification-worker

      - name: Run container
        run: |
          docker stop notification-worker || true
          docker rm notification-worker || true
          docker run -d --name notification-worker -p 8084:8084 notification-worker:latest
