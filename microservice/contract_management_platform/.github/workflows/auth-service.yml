name: Auth Service CI/CD

on:
  push:
    paths:
      - 'auth-service/**'
  pull_request:
    paths:
      - 'auth-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build Go
      run: |
        cd auth-service
        go mod tidy
        go build -o app ./cmd/server

    - name: Login Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build & Push Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }} auth-service
        docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}

    - name: Set kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig

    - name: Deploy to Kubernetes
      run: |
        kubectl -n contract-platform set image deployment/auth-service auth-service=${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}
