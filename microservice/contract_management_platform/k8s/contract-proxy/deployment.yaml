apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-proxy
  namespace: contract-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-proxy
  template:
    metadata:
      labels:
        app: contract-proxy
    spec:
      containers:
      - name: contract-proxy
        image: artis50217/contract-proxy:latest
        ports:
        - containerPort: 8080
