apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: contract-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: artis50217/auth-service:latest
        ports:
        - containerPort: 8080
